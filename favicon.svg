    <path d="M16 26 L16 42 Q16 50 32 54 Q48 50 48 42 L48 26 Z" fill="#383838" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Top board (light gray) with outline -->
    <polygon points="32,8 58,22 32,36 6,22" fill="#757575" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Tassel string (gold) outline -->
    <polyline points="32,22 22,28 22,46" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tassel string (gold) fill -->
    <polyline points="32,22 22,28 22,46" fill="none" stroke="#eba300" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tassel fringe (gold) with outline -->
    <!-- outline -->
    <path d="M18.5 45 L25.5 45 L26.5 53 L24 50 L22 53 L20 50 L17.5 53 Z" fill="#000000"/>
    <!-- fill -->
    <path d="M19.5 46 L24.5 46 L25.5 52 L24 50 L22 52 L20 50 L18.5 52 Z" fill="#eba300"/>

    <!-- Tassel button -->
